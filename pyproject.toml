[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gust-loads-surrogate"
version = "0.1.0"
description = "Physics-based aeroelastic solver + ML surrogate for discrete gust loads"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Gust Loads Surrogate"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pytest>=7.0",
    "pandas>=2.0",
    "torch>=2.0",
]

[project.optional-dependencies]
full = ["scikit-learn", "joblib", "scikit-optimize", "pyarrow", "streamlit"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
